[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "semantic-markdown"
version = "0.2.0"
description = "A block-addressable document format for human-agent collaboration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["markdown", "json", "document-format", "llm", "semantic"]
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
smd = "semantic_markdown.__main__:main"
smd-mcp = "semantic_markdown.harness:main"

[project.urls]
homepage = "https://github.com/finxsight/semantic-markdown"
documentation = "https://github.com/finxsight/semantic-markdown/blob/main/SPECIFICATION.md"

[tool.setuptools.packages.find]
where = ["src"]
